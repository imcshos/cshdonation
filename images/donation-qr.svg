  <!-- Bottom Account Details -->
  <text x="250" y="545" font-family="'Kanit', sans-serif" font-size="18" font-weight="600" fill="#1a5c3a" text-anchor="middle">ชื่อบัญชี: เงินบริจาคโรงพยาบาลเชียงแสน</text>
  <text x="250" y="572" font-family="'Sarabun', sans-serif" font-size="14" fill="#586b72" text-anchor="middle">สแกนผ่าน Mobile Banking ได้ทุกธนาคาร</text>
  <text x="250" y="593" font-family="'Sarabun', sans-serif" font-size="12" fill="#2d7a52" font-weight="600" text-anchor="middle">✨ สามารถใช้สิทธิ์ลดหย่อนภาษีได้ 2 เท่า</text>
